name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  backend:
    name: Backend · lint + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # inferbench se DISTRIBUYE para los tres sistemas (el release construye .exe, .dmg y
    # .AppImage), pero la suite solo corría en Linux. Resultado medido el 2026-08-13:
    # `psutil.cpu_freq` no existe en macOS, `_detect_cpu()` reventaba, y como
    # `BenchmarkRunner.__init__` llama a `detect_hardware()`, en un Mac fallaba TODO
    # benchmark. Llevaba ahí desde siempre y ningún CI lo veía. Probar donde se distribuye
    # es la única forma de cazar esta clase de fallo.
    strategy:
      fail-fast: false  # si macOS falla, queremos ver igual el veredicto de los otros dos
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Desde uv.lock, NO `pip install -e ".[dev]"`. Con la resolución libre, CI instalaba
      # lo último de todo y se rompía sin que nadie tocase código: pasó con ruff 0.16
      # (amplió su set de reglas por defecto → 92 errores) y con mcp 2.0 (movió
      # `mcp.server.fastmcp` → Serve/MCP roto también en instalaciones nuevas). `--locked`
      # falla si el lock no cuadra con pyproject.toml, así que no puede quedarse obsoleto
      # en silencio. Para subir una dependencia: `uv lock --upgrade-package X` y se ve en
      # el diff.
      # `--python 3.11` explícito: sin él uv elige el intérprete más nuevo que encuentre en
      # el runner, no el que instala setup-python. Se descubrió construyendo el sidecar,
      # que salió con CPython 3.14 (ver PR #47); aquí el riesgo es el mismo, validar sobre
      # un runtime que nadie distribuye.
      - name: Install deps (uv.lock)
        run: uv sync --locked --python 3.11 --extra dev
      - name: Ruff (lint)
        run: uv run ruff check core api main.py tests
      # `black` estaba configurado en pyproject y declarado como dep de dev, pero no lo
      # ejecutaba nadie: había acumulado 9 ficheros sin formatear. Formatear una vez sin
      # poner el gate solo aplaza la siguiente deriva.
      - name: Black (formato)
        run: uv run black --check .
      - name: Pytest
        run: uv run pytest -q

  frontend:
    name: Frontend · build + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install deps (workspace)
        run: npm ci
      - name: Build (Vite)
        run: npm run build --workspace frontend
      - name: Unit tests (node --test)
        run: npm run test:unit --workspace frontend
      - name: Audit (no rompe el build)
        run: npm audit --omit=dev || true

  website:
    name: Website · build
    runs-on: ubuntu-latest
    # La landing NO estaba cubierta por ningún CI: se construye y despliega desde
    # `deploy-website.yml`, que solo corre al empujar a master. MEDIDO el 2026-08-19 con la
    # PR #53 (bump de Snyk a astro 7): los checks salían todos verdes y el build de la
    # landing estaba ROTO — `@import "tailwindcss"` dejaba de resolverse y `astro build`
    # moría con `ENOENT ... /website/tailwindcss`. Mergear habría tumbado el despliegue.
    # Node 24 para igualar al deploy: astro exige >= 22.12 y validar en otra versión no
    # prueba lo que se publica.
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install deps (lockfile)
        run: npm ci
      - name: Build (Astro)
        run: npm run build
      # Un build verde no basta: si la tubería de Tailwind se rompe en silencio, astro
      # sigue saliendo con código 0 y publica la landing SIN estilos. El CSS ronda los
      # 25 KB; por debajo de 10 KB es que Tailwind no ha generado nada.
      - name: El CSS tiene contenido de verdad
        run: |
          css=$(ls dist/_astro/*.css | head -1)
          bytes=$(wc -c < "$css")
          echo "$css -> $bytes bytes"
          test "$bytes" -ge 10000
      - name: Audit (no rompe el build)
        run: npm audit --omit=dev || true
