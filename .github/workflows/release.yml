name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write  # crear la Release y subir artefactos

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash  # disponible en los 3 runners → cp/mkdir portables
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Desde uv.lock, igual que CI. Antes era `uv pip install -e . pyinstaller`, que
      # ignora el lock y resuelve libre: el binario que se DISTRIBUYE se construía con
      # dependencias que nadie había probado, mientras CI validaba otras. Es el mismo
      # patrón que ya rompió dos veces (ruff 0.16 tumbó el gate, mcp 2.0 dejó Serve/MCP
      # roto en instalaciones nuevas). `--locked` falla si el lock no cuadra con
      # pyproject, así que no puede quedarse atrás en silencio.
      - name: Instalar dependencias (uv.lock)
        working-directory: backend
        run: uv sync --locked --python 3.11 --extra dev --extra build

      # El instalador que se publica debe salir de código que pasa la suite. Antes se
      # empaquetaba sin correr un solo test: un fallo que CI habría cazado llegaba igual
      # al binario si alguien etiquetaba sin mirar el estado de la rama.
      - name: Tests antes de empaquetar
        working-directory: backend
        run: uv run pytest -q

      - name: Build sidecar (PyInstaller)
        working-directory: backend
        run: uv run pyinstaller pyinstaller.spec --clean --noconfirm

      - name: Copy sidecar into Electron resources
        run: |
          mkdir -p frontend/electron/sidecar
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp backend/dist/inferbench-backend.exe frontend/electron/sidecar/
          else
            cp backend/dist/inferbench-backend frontend/electron/sidecar/
            chmod +x frontend/electron/sidecar/inferbench-backend
          fi

      - name: Install JS deps (workspace)
        # npm install (no ci) para asegurar que app-builder-bin coloca sus binarios
        # de plataforma correctamente en el monorepo/workspace.
        run: npm install --no-audit --no-fund

      - name: Build installer (electron-builder)
        working-directory: frontend
        # Sin GH_TOKEN aquí: no queremos que electron-builder publique (lo hace
        # softprops más abajo). --publish never evita que intente detectar el repo.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"  # sin firma de código (0.x)
        run: |
          npm run build
          npx electron-builder --publish never

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true  # se publica a mano tras comprobar los 3 binarios
          files: |
            frontend/release/*.exe
            frontend/release/*.dmg
            frontend/release/*.AppImage
            frontend/release/latest*.yml
