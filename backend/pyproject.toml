[project]
name = "inferbench-backend"
version = "0.2.0"
description = "Backend FastAPI para InferBench"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "psutil>=6.1",
  "nvidia-ml-py>=12.0",
  "docker>=7.1",
  "httpx>=0.28",
  "sse-starlette>=2.1",
  "loguru>=0.7",
  "keyring>=25.5",
  "sqlmodel>=0.0.22",
  # `mcp_server.py` construye el server con la API que toque: 2.x (`MCPServer`) o 1.x
  # (`FastMCP`), que es donde vivía antes. La suite pasa entera contra AMBAS, así que el
  # techo de `<2` que puso el arreglo de urgencia ya no hace falta. Se deja en `<3` porque
  # la 2.0 ya demostró que estos SDK rompen en mayores: el job semanal `deps-al-dia`
  # avisará cuando salga la 3.
  "mcp>=1.2,<3"
]

[project.optional-dependencies]
# Techo en ruff: sin él CI instala la última versión y un cambio de defaults tumba el
# gate sin que nadie toque código (pasó con 0.16). El `select` de [tool.ruff.lint] es la
# otra mitad de la defensa.
dev = ["ruff>=0.15,<0.17", "black>=24", "pytest>=8", "pytest-asyncio>=0.24"]
# Herramientas para EMPAQUETAR el sidecar. Van declaradas —y por tanto en uv.lock— para
# que el binario que se distribuye se construya con las mismas versiones que CI valida.
# El workflow de release hacía `uv pip install -e . pyinstaller`, que ignora el lock y
# resuelve libre: exactamente el patrón que ya rompió dos veces (ruff 0.16 tumbó el gate,
# mcp 2.0 dejó Serve/MCP roto en instalaciones nuevas). Un release construido así puede
# llevar dependencias que nadie probó.
build = ["pyinstaller>=6.10,<7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["api", "core", "engines"]
include-package-data = false
py-modules = ["main"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
# Los scripts de mantenimiento del catálogo priorizan legibilidad sobre lint estricto
extend-exclude = ["scripts"]

[tool.ruff.lint]
# Selección EXPLÍCITA a propósito. Hasta ruff 0.15 el proyecto vivía del set por defecto
# (E4/E7/E9/F); ruff 0.16 amplió ese default a decenas de reglas nuevas (BLE/S/SIM/UP/I/
# DTZ/ASYNC/PL…) y, como el dev extra pedía `ruff>=0.7` sin techo, CI empezó a instalar
# 0.16 y a fallar con 92 errores sobre código que no había cambiado. Declarar `select`
# hace que subir de versión no cambie el veredicto por su cuenta: para adoptar una regla
# nueva, se añade aquí a mano y se arregla el código en el mismo commit.
select = ["E4", "E7", "E9", "F"]
# E702: estilo compacto deliberado en gguf_reader (struct unpack + return en una línea)
ignore = ["E702"]

[tool.black]
line-length = 100
target-version = ["py311"]
